# Bootstrap with a cluster administrator; Jenkins receives no write or Secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-verification
  namespace: boutique-dev
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - rollouts
  resourceNames:
  - frontend
  - catalogue
  - cart
  - orders
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - services
  resourceNames:
  - frontend
  - catalogue
  - cart
  - orders
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-verification
  namespace: boutique-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-verification
subjects:
- kind: User
  name: boutique:jenkins-verifier:dev
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-verification-dev
  namespace: argocd
rules:
- apiGroups:
  - argoproj.io
  resources:
  - applications
  resourceNames:
  - boutique-dev
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-verification-dev
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-verification-dev
subjects:
- kind: User
  name: boutique:jenkins-verifier:dev
  apiGroup: rbac.authorization.k8s.io
---
