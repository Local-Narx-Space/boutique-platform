rule_files:
- rules.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: boutique_http_requests_total{service="frontend",environment="production",cluster="homelab",route="/api/products",method="GET",status="200"}
    values: 0+95x80
  - series: boutique_http_requests_total{service="frontend",environment="production",cluster="homelab",route="/api/products",method="GET",status="500"}
    values: 0+5x80
  - series: boutique_http_request_duration_seconds_count{service="frontend",environment="production",cluster="homelab",route="/api/products",method="GET",status="200"}
    values: 0+95x80
  - series: boutique_http_request_duration_seconds_bucket{service="frontend",environment="production",cluster="homelab",route="/api/products",method="GET",status="200",le="1"}
    values: 0+80x80
  alert_rule_test:
  - eval_time: 65m
    alertname: BoutiqueProductionAvailabilityBudgetBurn
    exp_alerts:
    - exp_labels:
        service: frontend
        environment: production
        cluster: homelab
        severity: critical
        slo: errors
      exp_annotations:
        summary: Production API availability budget is burning at over 14.4x
        runbook_url: https://github.com/Local-Narx-Space/boutique-ci/blob/main/DOC.md#202-slos-and-budget-burn
    - exp_labels:
        service: frontend
        environment: production
        cluster: homelab
        severity: warning
        slo: errors
      exp_annotations:
        summary: Production API availability budget is burning at over 6x
        runbook_url: https://github.com/Local-Narx-Space/boutique-ci/blob/main/DOC.md#202-slos-and-budget-burn
  - eval_time: 65m
    alertname: BoutiqueProductionLatencyBudgetBurn
    exp_alerts:
    - exp_labels:
        service: frontend
        environment: production
        cluster: homelab
        severity: critical
        slo: slow
      exp_annotations:
        summary: Production API latency budget is burning at over 14.4x
        runbook_url: https://github.com/Local-Narx-Space/boutique-ci/blob/main/DOC.md#202-slos-and-budget-burn
    - exp_labels:
        service: frontend
        environment: production
        cluster: homelab
        severity: warning
        slo: slow
      exp_annotations:
        summary: Production API latency budget is burning at over 6x
        runbook_url: https://github.com/Local-Narx-Space/boutique-ci/blob/main/DOC.md#202-slos-and-budget-burn
- interval: 1m
  input_series:
  - series: boutique_http_requests_total{service="frontend",environment="production",cluster="homelab",route="/api/products",method="GET",status="200"}
    values: 0+100x80
  - series: boutique_http_requests_total{service="frontend",environment="production",cluster="homelab",route="/api/products",method="GET",status="500"}
    values: 0+0x80
  - series: boutique_http_request_duration_seconds_count{service="frontend",environment="production",cluster="homelab",route="/api/products",method="GET",status="200"}
    values: 0+100x80
  - series: boutique_http_request_duration_seconds_bucket{service="frontend",environment="production",cluster="homelab",route="/api/products",method="GET",status="200",le="1"}
    values: 0+100x80
  alert_rule_test:
  - eval_time: 65m
    alertname: BoutiqueProductionAvailabilityBudgetBurn
    exp_alerts: []
  - eval_time: 65m
    alertname: BoutiqueProductionLatencyBudgetBurn
    exp_alerts: []
- interval: 1m
  input_series:
